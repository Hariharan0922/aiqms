services:
  # 1. FastAPI Backend Service (Python 3.12)
  - type: web
    name: aidocmaker-api
    runtime: python
    plan: free
    buildCommand: "pip install -r apps/api/requirements.txt"
    startCommand: "uvicorn app.main:app --host 0.0.0.0 --port $PORT --app-dir apps/api"
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
      - key: ENVIRONMENT
        value: production
      - key: DATABASE_URL
        value: sqlite:////app/data/aiqms.db
      - key: AIQMS_STORAGE_DIR
        value: ./data
      - key: DEV_AUTH_ENABLED
        value: "true"
      - key: NVIDIA_API_KEY
        sync: false
      - key: NVIDIA_BASE_URL
        value: https://integrate.api.nvidia.com/v1
      - key: NVIDIA_MODEL
        value: poolside/laguna-xs-2.1
      - key: NVIDIA_TIMEOUT
        value: "120"
      - key: NVIDIA_MAX_RETRIES
        value: "2"
      - key: OPENROUTER_API_KEY
        sync: false
      - key: OPENROUTER_BASE_URL
        value: https://openrouter.ai/api/v1
      - key: OPENROUTER_MODEL
        value: nvidia/nemotron-3-ultra-550b-a55b:free
      - key: CORS_ORIGINS
        value: "*"

  # 2. Vite React Frontend Service (Static Site)
  - type: web
    name: aidocmaker-web
    runtime: static
    plan: free
    buildCommand: "cd apps/web && npm install && npm run build"
    staticPublishPath: "./apps/web/dist"
    routes:
      - type: rewrite
        source: "/*"
        destination: "/index.html"
    envVars:
      - key: VITE_API_BASE_URL
        fromService:
          type: web
          name: aidocmaker-api
          property: host
